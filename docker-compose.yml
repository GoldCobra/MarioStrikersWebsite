name: mario-strikers-dev
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "--watch", "apps/api/src/dev.ts"]
    environment:
      NODE_ENV: development
      DEV_HOST: 0.0.0.0
      PORT: 8787
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages/shared/src:/app/packages/shared/src:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    # The development command edits the nginx configuration before starting it.
    user: root
    command:
      - /bin/sh
      - -c
      - >-
        sed -i 's/add_header Cache-Control .*/add_header Cache-Control "no-store" always;/' /etc/nginx/http.d/default.conf
        && exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
