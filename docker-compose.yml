name: mario-strikers-dev
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: npm run dev
    environment:
      NODE_ENV: development
      DEV_HOST: 0.0.0.0
      PORT: 8787
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command:
      - /bin/sh
      - -c
      - >-
        sed -i 's/add_header Cache-Control .*/add_header Cache-Control "no-store" always;/' /etc/nginx/http.d/default.conf
        && exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./pages:/usr/share/nginx/html/pages:ro
    depends_on:
      - backend
