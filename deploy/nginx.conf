# Mario Strikers Community Website — Nginx site config
#
# Setup:
#   1. Copy to /etc/nginx/sites-available/msc
#   2. Replace YOUR_DOMAIN with your actual domain (two places below)
#   3. Replace /var/www/msc with the path where you uploaded the project
#   4. ln -s /etc/nginx/sites-available/msc /etc/nginx/sites-enabled/msc
#   5. nginx -t && systemctl reload nginx
#   6. certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN   (adds HTTPS automatically)

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/msc;
    index index.html;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-lived cache for versioned static assets (JS/CSS use ?v= cache busting)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Proxy all /api/* requests to the Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # All other requests: serve static files, fall back to 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
