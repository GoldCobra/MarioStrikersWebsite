<div id="profile-edit-popup" class="profile-edit-popup popup-overlay" hidden aria-hidden="true">
  <button class="profile-edit-backdrop popup-backdrop" type="button" data-action="popup-close" aria-label="Close profile editor" tabindex="-1"></button>
  <section class="profile-edit-card popup-card" role="dialog" aria-modal="true" aria-labelledby="profile-edit-title">
    <button class="profile-edit-close popup-close" type="button" data-action="popup-close" aria-label="Close profile editor">×</button>

    <header class="profile-edit-header popup-header">
      <h2 id="profile-edit-title" class="profile-edit-title popup-title">Edit Profile</h2>
    </header>

    <div class="profile-edit-body">
      <p class="profile-edit-loading loading-note" data-slot="popup-status">Loading...</p>

      <form class="profile-edit-form" data-slot="popup-content" novalidate hidden>
        <p class="profile-edit-summary" data-slot="summary" role="alert" hidden></p>

        <section class="profile-edit-section" aria-labelledby="profile-edit-discord-title">
          <h3 id="profile-edit-discord-title" class="profile-edit-section-title">Discord</h3>
          <dl class="profile-edit-names">
            <div class="profile-edit-name">
              <dt>Server name</dt>
              <dd data-slot="server-name">-</dd>
            </div>
            <div class="profile-edit-name">
              <dt>Username</dt>
              <dd data-slot="username">-</dd>
            </div>
          </dl>
          <p class="profile-edit-note" data-slot="names-note" hidden></p>
        </section>

        <section class="profile-edit-section" data-group="country">
          <label class="profile-edit-section-title" for="profile-edit-country">Country</label>
          <div class="profile-edit-country">
            <select id="profile-edit-country" class="profile-edit-select" data-slot="country" aria-describedby="profile-edit-error-country"></select>
            <img class="profile-edit-flag" data-slot="flag" src="" alt="" width="30" height="20" data-on-error="hide" hidden>
          </div>
          <p id="profile-edit-error-country" class="profile-edit-error" data-error="country" hidden></p>
        </section>

        <section class="profile-edit-section" data-group="switch" aria-labelledby="profile-edit-switch-title">
          <h3 id="profile-edit-switch-title" class="profile-edit-section-title">Switch Friend Code</h3>
          <div class="profile-edit-code" role="group" aria-labelledby="profile-edit-switch-title" data-code="switch">
            <span class="profile-edit-code-prefix" aria-hidden="true">SW-</span>
            <input class="profile-edit-digits" type="text" inputmode="numeric" autocomplete="off" maxlength="4" spellcheck="false" enterkeyhint="next" aria-label="Switch friend code, digits 1 to 4" aria-describedby="profile-edit-error-switch">
            <span class="profile-edit-code-dash" aria-hidden="true">-</span>
            <input class="profile-edit-digits" type="text" inputmode="numeric" autocomplete="off" maxlength="4" spellcheck="false" enterkeyhint="next" aria-label="Switch friend code, digits 5 to 8" aria-describedby="profile-edit-error-switch">
            <span class="profile-edit-code-dash" aria-hidden="true">-</span>
            <input class="profile-edit-digits" type="text" inputmode="numeric" autocomplete="off" maxlength="4" spellcheck="false" enterkeyhint="done" aria-label="Switch friend code, digits 9 to 12" aria-describedby="profile-edit-error-switch">
            <button class="profile-edit-clear" type="button" data-clear="switch" aria-label="Clear the Switch friend code">×</button>
          </div>
          <p id="profile-edit-error-switch" class="profile-edit-error" data-error="switch_code" hidden></p>
        </section>

        <section class="profile-edit-section" data-group="msc" aria-labelledby="profile-edit-msc-title">
          <h3 id="profile-edit-msc-title" class="profile-edit-section-title">MSC Friend Codes</h3>
          <ol class="profile-edit-msc-list" data-list="msc"></ol>
          <p class="profile-edit-error" data-error="msc" hidden></p>
        </section>

        <div class="profile-edit-footer">
          <div class="profile-edit-confirm" data-slot="confirm" role="alertdialog" aria-labelledby="profile-edit-confirm-text" hidden>
            <p id="profile-edit-confirm-text" class="profile-edit-confirm-text">Discard your unsaved changes?</p>
            <div class="profile-edit-confirm-actions">
              <button class="profile-action-button" type="button" data-action="discard">Discard changes</button>
              <button class="profile-action-button" type="button" data-action="keep">Keep editing</button>
            </div>
          </div>
          <div class="profile-edit-actions">
            <p class="profile-edit-status" data-slot="save-status" role="status" aria-live="polite"></p>
            <button class="profile-action-button profile-edit-apply" type="submit" data-action="apply">Apply</button>
            <button class="profile-action-button" type="button" data-action="popup-close">Close</button>
          </div>
        </div>
      </form>
    </div>
  </section>
</div>
