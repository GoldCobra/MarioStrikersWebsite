<div id="club-profile-popup" class="club-popup popup-overlay" hidden aria-hidden="true">
  <button class="club-popup-backdrop popup-backdrop" data-action="popup-close" aria-label="Close club profile popup"></button>
  <section class="club-popup-card popup-card" role="dialog" aria-modal="true" aria-labelledby="club-popup-name">
    <button class="club-popup-close popup-close" type="button" data-action="popup-close" aria-label="Close club profile popup">×</button>

    <header class="club-popup-header popup-header">
      <div class="club-popup-header-title">
        <h2 id="club-popup-name" class="club-popup-name popup-title" data-slot="club-name">-</h2>
      </div>
    </header>

    <div class="club-popup-body player-popup-body">
      <p class="club-popup-status player-popup-status loading-note" data-slot="popup-status">Loading...</p>

      <div class="club-popup-content player-popup-content" data-slot="popup-content" hidden>
        <img class="club-popup-bg-logo" data-slot="club-logo-bg" src="" alt="" aria-hidden="true" hidden onerror="this.hidden=true;this.removeAttribute('src');">

        <section class="club-popup-section club-popup-meta-section player-popup-section" aria-label="Club profile details">
          <div class="club-popup-meta-grid">
            <p class="club-popup-line player-popup-results-line club-popup-meta-left" data-slot="club-line-primary">-</p>
            <h3 class="player-popup-section-title club-popup-meta-right">Created Date</h3>
            <p class="club-popup-line player-popup-results-line club-popup-meta-left club-popup-region-line" data-slot="club-line-regions"></p>
            <p class="club-popup-line player-popup-results-line club-popup-meta-right" data-slot="created-date"></p>
            <h3 class="player-popup-section-title club-popup-meta-left">Roster</h3>
            <a class="club-popup-discord-link club-popup-meta-right" data-slot="club-discord-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open club Discord" hidden></a>
          </div>
        </section>

        <section class="club-popup-section club-popup-roster-section player-popup-section">
          <ul class="club-popup-roster" data-list="roster"></ul>
        </section>
      </div>
    </div>
  </section>
</div>
