<!doctype html>
<html lang="en-US">
<head>

  <link rel="preload" href="../assets/fonts/itc-grizzly.woff" as="font" type="font/woff" crossorigin>

  <title>MSL Schedule | Mario Strikers Community</title>
  <link rel="stylesheet" href="../css/global.css?v=20260418-runtime-cleanup-v8">
  <style>
    .msl-schedule-page {
      padding-top: var(--space-3);
      padding-bottom: clamp(1.5rem, 3.4vw, 2.2rem);
    }

    .msl-schedule-root {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      text-align: center;
    }

    .msl-schedule-list {
      margin: 0;
      padding: 0;
    }

    .msl-schedule-item + .msl-schedule-item {
      margin-top: clamp(1.25rem, 2.8vw, 1.9rem);
    }

    .msl-schedule-title {
      margin: 0;
      font-family: "ITC Grizzly", sans-serif;
      font-size: calc(clamp(1.24rem, 1.7vw, 1.72rem) + 3px);
      font-weight: 400;
      line-height: 1.2;
      color: #fff;
      -webkit-text-stroke: 2px #000;
      text-stroke: 2px #000;
      paint-order: stroke fill;
      filter: drop-shadow(-3px 2px 0 #000);
      text-transform: uppercase;
      text-wrap: balance;
    }

    .msl-schedule-meta {
      margin: 0.35rem 0 0;
      font-family: "Trade Gothic Next BdCn", "ITC Grizzly", sans-serif;
      font-size: calc(clamp(0.84rem, 0.95vw, 0.96rem) + 1px);
      line-height: 1.35;
      color: #f4f4f4;
      text-shadow: -1px 1px 0 #000;
      text-transform: none;
    }
  </style>
</head>
