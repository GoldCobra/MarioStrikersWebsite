services:
  flaresolverr:
    # Pinned to the running version; Dependabot proposes updates.
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - strikers-network

  backend:
    image: mario-strikers-website-backend:${RELEASE_SHA:?Use scripts/deploy.py to select a release}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    container_name: msc-website-backend
    environment:
      - NODE_ENV=production
      - FLARESOLVERR_URL=http://flaresolverr:8191
      # Caddy and nginx sit in front; the client address is the third X-Forwarded-For hop.
      - TRUST_PROXY_HOPS=2
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    volumes:
      - backend-cache:/app/.cache
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - strikers-network
      # The SQL Server container on the same server (/opt/mssql), reachable as host "mssql".
      - mssql

  caddy:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    container_name: msc-website-caddy
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - strikers-network

  frontend:
    image: mario-strikers-website-frontend:${RELEASE_SHA:?Use scripts/deploy.py to select a release}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    container_name: msc-website-frontend
    environment:
      - NODE_ENV=production
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - strikers-network

networks:
  strikers-network:
    driver: bridge
  mssql:
    external: true

volumes:
  backend-cache:
  caddy_config:
  caddy_data:
