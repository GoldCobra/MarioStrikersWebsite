services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - strikers-network

  backend:
    image: mario-strikers-website-backend:${RELEASE_SHA:?Use scripts/deploy.py to select a release}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    container_name: msc-website-backend
    environment:
      - NODE_ENV=production
      - FLARESOLVERR_URL=http://flaresolverr:8191
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    volumes:
      - backend-cache:/app/.cache
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - strikers-network

  caddy:
    image: caddy:2
    container_name: msc-website-caddy
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - strikers-network

  frontend:
    image: mario-strikers-website-frontend:${RELEASE_SHA:?Use scripts/deploy.py to select a release}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        RELEASE_SHA: ${RELEASE_SHA}
    container_name: msc-website-frontend
    environment:
      - NODE_ENV=production
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - strikers-network

networks:
  strikers-network:
    driver: bridge

volumes:
  backend-cache:
  caddy_config:
  caddy_data:
