name: CI

on:
  push:
    branches:
      - gc-updates
      - 'chore/**'
  pull_request:
    branches: [gc-updates]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:smoke

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:frontend
      - run: git diff --check

  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -f Dockerfile.backend -t website-backend:ci .
      - run: docker build --build-arg RELEASE_SHA=${{ github.sha }} -f Dockerfile.frontend -t website-frontend:ci .
      - run: docker run --rm --add-host backend:127.0.0.1 website-frontend:ci nginx -t
      - name: Validate local Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose without credentials
        run: |
          touch "$RUNNER_TEMP/website-empty.env"
          RELEASE_SHA="$GITHUB_SHA" BACKEND_ENV_FILE="$RUNNER_TEMP/website-empty.env" docker compose -f docker-compose.prod.yml config --quiet
      - name: Start Docker development
        run: docker compose up --build -d
      - name: Check Docker example data and frontend
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base = 'http://127.0.0.1:8080'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + '/api/health', timeout=2) as response:
                      assert json.load(response) == {'status': 'ok', 'source': 'fixtures'}
                  break
              except (OSError, AssertionError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          for route in ['/', '/players', '/msbl-elo1v1', '/pages/templates/msbl-gear-builder.html', '/api/clubs/msbl/1/logo']:
              with urllib.request.urlopen(base + route, timeout=5) as response:
                  assert response.status == 200, route
          with urllib.request.urlopen(base + '/api/auth/me', timeout=5) as response:
              assert response.headers['X-Data-Source'] == 'fixtures'
              assert json.load(response) == {'authenticated': False, 'login_available': True}
          with urllib.request.urlopen(base + '/assets/logo/logo.webp', timeout=5) as response:
              assert 'no-store' in response.headers['Cache-Control']
          print('Docker development serves synthetic data, clean routes, templates and uncached assets.')
          PY
      - name: Admin page only behind nginx's gate (docs/adr/0011)
        run: |
          python3 - <<'PY'
          import http.client, json, re
          PAGE = '/_/fixture-admin-page-0000000/'

          def get(path, cookie=None):
              conn = http.client.HTTPConnection('127.0.0.1', 8080, timeout=10)
              conn.request('GET', path, headers={'Cookie': cookie} if cookie else {})
              response = conn.getresponse()
              body = response.read()
              conn.close()
              return response, body

          def login(code):
              start, _ = get('/api/auth/discord/start?returnTo=%2F')
              state_cookie = start.getheader('Set-Cookie').split(';')[0]
              callback = start.getheader('Location').replace('code=sample&', 'code=' + code + '&')
              done, _ = get(callback, state_cookie)
              assert done.status == 302, (code, done.status)
              return next(c.split(';')[0] for c in done.msg.get_all('Set-Cookie') if c.startswith('msc_dev_session='))

          not_found, missing = get('/does-not-exist')
          assert not_found.status == 404
          def refused(path, cookie=None):
              response, body = get(path, cookie)
              assert response.status == 404 and body == missing, (path, response.status)
              for header in ['Content-Type', 'Cache-Control', 'Content-Security-Policy', 'X-Robots-Tag']:
                  assert response.getheader(header) == not_found.getheader(header), (path, header)

          admin = login('sample-admin')
          page, html = get(PAGE, admin)
          assert page.status == 200 and b'data-page="admin"' in html, page.status
          assert page.getheader('Cache-Control') == 'no-store' and page.getheader('X-Robots-Tag') == 'noindex, nofollow'
          module = re.search(rb'src="(modules/[^"]+\.js)"', html).group(1).decode()
          assert get(PAGE + module, admin)[0].status == 200
          me = json.loads(get('/api/auth/me', admin)[1])
          assert me['account_links'] == [{'label': 'Admin', 'href': PAGE}], me
          assert json.loads(get('/api/admin/overview', admin)[1])['admin']['username'] == 'sample_admin'

          member = login('sample')
          assert 'account_links' not in json.loads(get('/api/auth/me', member)[1])
          for cookie in [None, member]:
              for path in [PAGE, PAGE + module, PAGE + 'index.html', '/_/x/', PAGE[:-1], '/__admin_gate', '/internal/admin-gate']:
                  refused(path, cookie)
              response, body = get('/api/admin/overview', cookie)
              assert response.status == 404 and body == get('/api/no-such-route')[1]
          print('The admin page opens for the admin only; everyone else gets the ordinary not-found page.')
          PY
      - name: Install end-to-end tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Routes match the production golden (nginx)
        run: node tests/e2e/run.ts routes
        env:
          ROUTES_URL: http://127.0.0.1:8080
      - name: Stop Docker development before the comparison stacks
        run: docker compose down --volumes
      - name: Rendered markup matches the DOM and head goldens
        run: node tests/e2e/run.ts dom
      - name: Pages look identical to the reference commit
        run: node tests/e2e/run.ts visual
      - name: API answers identically to the reference commit
        run: node tests/e2e/run.ts contract
      - name: Upload end-to-end report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            tests/e2e/.cache/report
            tests/e2e/.cache/test-results
          retention-days: 14
      - name: Stop Docker development
        if: always()
        run: docker compose down --volumes

  deployment:
    name: deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_deploy*.py' -v
