server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:css|js|mjs|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /pages/msbl.html {
        return 301 /msbl-gear-builder$is_args$args;
    }

    location = /pages/msbl {
        return 301 /msbl-gear-builder$is_args$args;
    }

    location = /pages/msbl/ {
        return 301 /msbl-gear-builder$is_args$args;
    }

    location = /pages/msl-league-site.html {
        return 301 /msl-schedule$is_args$args;
    }

    location = /pages/msl-league-site {
        return 301 /msl-schedule$is_args$args;
    }

    location = /pages/msl-league-site/ {
        return 301 /msl-schedule$is_args$args;
    }

    location = /pages/players-msbl-clubs.html {
        return 404;
    }

    location = /pages/msbl-tier-lists.html {
        return 404;
    }

    location = /pages/msc-tier-lists.html {
        return 404;
    }

    location = /pages/sms-tier-lists.html {
        return 404;
    }

    location ~ ^/pages/([a-z0-9-]+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location = /msbl {
        return 301 /msbl-gear-builder$is_args$args;
    }

    location = /msbl/ {
        return 301 /msbl-gear-builder$is_args$args;
    }

    location = /msl-league-site {
        return 301 /msl-schedule$is_args$args;
    }

    location = /msl-league-site/ {
        return 301 /msl-schedule$is_args$args;
    }

    location ~ ^/(about-us|community-tournaments|competitive|games|msbl-gear-builder|msbl-competitiverules|msbl-elo1v1|msbl-elo2v2|msbl-save-editor|msbl-tierlist|msbl-whr|msc|msc-competitiverules|msc-elo1v1|msc-save-editor|msc-setup-guide|msc-tierlist|msc-whr|msc-wiimmfi|msl|msl-leaderboards|msl-league-rules|msl-schedule|partners|players|msbl-striker-clubs|players-profiles|privacy-policy|sms|sms-competitiverules|sms-elo1v1|sms-setup-guide|sms-tierlist|sms-whr|tab-placeholder)/$ {
        return 301 /$1$is_args$args;
    }

    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ @clean_pages;
    }

    location @clean_pages {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        rewrite ^/$ /index.html break;
        rewrite ^/([a-z0-9-]+)/?$ /pages/$1.html break;
        return 404;
    }
}
