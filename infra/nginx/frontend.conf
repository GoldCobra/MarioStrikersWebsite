server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    brotli on;
    brotli_static off;
    brotli_min_length 1024;
    brotli_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:css|js|mjs|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /pages/msbl.html {
        return 301 /msbl$is_args$args;
    }

    location = /pages/msbl {
        return 301 /msbl$is_args$args;
    }

    location = /pages/msbl/ {
        return 301 /msbl$is_args$args;
    }

    location = /pages/msl-league-site.html {
        return 301 /msl-schedule$is_args$args;
    }

    location = /pages/msl-league-site {
        return 301 /msl-schedule$is_args$args;
    }

    location = /pages/msl-league-site/ {
        return 301 /msl-schedule$is_args$args;
    }

    location = /pages/players-msbl-clubs.html {
        return 404;
    }

    location = /pages/msbl-tier-lists.html {
        return 404;
    }

    location = /pages/msc-tier-lists.html {
        return 404;
    }

    location = /pages/sms-tier-lists.html {
        return 404;
    }

    location ~ ^/pages/([a-z0-9-]+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location = /games {
        if ($arg_submenu = msbl) {
            return 301 /msbl$is_args$args;
        }
        if ($arg_submenu = msc) {
            return 301 /msc$is_args$args;
        }
        if ($arg_submenu = sms) {
            return 301 /sms$is_args$args;
        }
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files /pages/games.html =404;
    }

    location = /competitive {
        if ($arg_submenu = rules) {
            return 301 /competitive-rules$is_args$args;
        }
        if ($arg_submenu = leaderboards) {
            return 301 /competitive-leaderboards$is_args$args;
        }
        if ($arg_submenu = tier-lists) {
            return 301 /competitive-tier-lists$is_args$args;
        }
        if ($arg_submenu = msl) {
            return 301 /msl$is_args$args;
        }
        if ($arg_submenu = tournaments) {
            return 301 /competitive-tournaments$is_args$args;
        }
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files /pages/competitive.html =404;
    }

    location = /msl-league-site {
        return 301 /msl-schedule$is_args$args;
    }

    location = /msl-league-site/ {
        return 301 /msl-schedule$is_args$args;
    }

    location ~ ^/(about-us|community-tournaments|competitive|competitive-leaderboards|competitive-rules|competitive-tier-lists|competitive-tournaments|games|msbl|msbl-gear-builder|msbl-competitiverules|msbl-elo1v1|msbl-elo2v2|msbl-save-editor|msbl-tierlist|msbl-whr|msc|msc-competitiverules|msc-elo1v1|msc-save-editor|msc-setup-guide|msc-tierlist|msc-whr|msc-wiimmfi|msl|msl-leaderboards|msl-league-rules|msl-schedule|partners|players|msbl-striker-clubs|players-profiles|profile|privacy-policy|sms|sms-competitiverules|sms-elo1v1|sms-setup-guide|sms-tierlist|sms-whr|tab-placeholder)/$ {
        return 301 /$1$is_args$args;
    }

    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/ @clean_pages;
    }

    location @clean_pages {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        rewrite ^/$ /index.html break;
        rewrite ^/([a-z0-9-]+)/?$ /pages/$1.html break;
        return 404;
    }
}
