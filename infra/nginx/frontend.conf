server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    brotli on;
    brotli_static off;
    brotli_min_length 1024;
    brotli_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Unknown URLs get the site's own not-found page with status 404; the page has no URL of its own. It is
    # never stored, so a page that exists only for some visitors (the admin page below) is not remembered as
    # missing after they sign in.
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/document-headers.conf;
    }

    # The hidden admin page (docs/adr/0011): every request below /_/ first asks the API's admin gate, which
    # checks the secret path segment, the session and the member's Discord role. Anything but a yes, an
    # unreachable API included, ends in the ordinary not-found page above, exactly as for any unknown URL.
    # The files live outside the web root; /_/<token>/<file> maps to admin/<file>.
    location ^~ /_/ {
        auth_request /__admin_gate;
        error_page 401 403 404 500 502 503 504 =404 /404.html;
        root /usr/share/nginx/private;
        rewrite ^/_/[^/]+/$ /admin/index.html break;
        rewrite ^/_/[^/]+/(.+)$ /admin/$1 break;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/document-headers.conf;
        try_files $uri =404;
    }

    # The gate itself: internal only, outside the API's public /api/ paths.
    location = /__admin_gate {
        internal;
        proxy_pass http://backend:8787/internal/admin-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    location ~* \.(?:css|js|mjs|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    }

    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/snippets/document-headers.conf;
        try_files /index.html =404;
    }

    # Legacy URLs, retired pages and ?submenu= overviews come from the shared route data.
    include /etc/nginx/snippets/legacy-routes.conf;

    location ~ ^/pages/([a-z0-9-]+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # A page requested with a trailing slash redirects to its clean URL; other paths fall through.
    location ~ ^/([a-z0-9-]+)/$ {
        if (-f $document_root/pages/$1.html) {
            return 301 /$1$is_args$args;
        }
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/snippets/document-headers.conf;
        try_files $uri $uri/ @clean_pages;
    }

    # ^~ wins over the regex locations above, so API paths with file extensions are always proxied.
    location ^~ /api/ {
        # API responses are data for the pages, not documents for search results.
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API logs this id with every line of the request.
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/snippets/document-headers.conf;
        try_files $uri $uri/ @clean_pages;
    }

    location @clean_pages {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/snippets/document-headers.conf;
        rewrite ^/$ /index.html break;
        rewrite ^/([a-z0-9-]+)/?$ /pages/$1.html break;
        return 404;
    }
}
