# Security headers for the site's documents; HSTS, nosniff, Referrer-Policy and X-Frame-Options come from
# Caddy. Included in every location that serves HTML (a location with its own add_header drops the
# server's). tools/src/site-server.ts reads this file too, so local previews and the comparison checks
# run under the same policy.
#
# The policy allows only the site's own scripts, styles, fonts and requests. Images may also come from
# https: (Discord avatars, event images, club logos) and data:/blob: (Gear Builder screenshots); inline
# style attributes stay allowed for the Gear Builder snapshot. The SMS setup guide embeds a YouTube video.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
